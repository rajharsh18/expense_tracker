org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Kept disabled: share_plus 12.x still applies kotlin-android explicitly.
# file_picker 11+ requires builtInKotlin=true on AGP 9, which conflicts with share_plus 12.
android.builtInKotlin=false
# Kotlin incremental compilation fails on Windows when the project drive
# (e.g. G:) differs from the Gradle/pub-cache drive (e.g. C:), because the
# compiler cannot compute a relative path across drive roots. Disabling
# incremental compilation avoids the "different roots" daemon crash.
kotlin.incremental=false
kotlin.incremental.android=false
