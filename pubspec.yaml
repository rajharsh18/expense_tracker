name: expense_tracker
description: Production-ready expense tracker compatible with CashBook backup format.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.31
  path_provider: ^2.1.5
  path: ^1.9.1
  go_router: ^15.1.2
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  fl_chart: ^0.70.2
  intl: ^0.20.2
  archive: ^4.0.7
  file_picker: 10.3.10
  share_plus: ^12.0.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.2.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  equatable: ^2.0.7
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/icon.png
  remove_alpha_ios: true
  min_sdk_android: 21
